# Build Go executables and a Ruby package whenever a v* tag is created.

name: Create Release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: gpg_relay_go/go.mod
          cache-dependency-path: gpg_relay_go/go.mod

      - name: Build Go executables
        run: make -C gpg_relay_go all

      - name: Create Go archive
        run: |
          tar zcf gpgrelay_go.tar.gz LICENSE \
            -C gpg_relay_go \
            gpg_relay_wsl gpg_relay_win.exe \
            README.md systemd

      - name: Create Ruby archive
        run: |
          tar zcf gpgrelay_ruby.tar.gz LICENSE \
            -C gpg_relay_ruby \
            relay.rb ssh_relay.rb gpg_relay_wsl.rb gpg_relay_win.rb \
            Gemfile Gemfile.lock \
            README.md systemd

      - name: Create Ruby archive
        run: |
          tar zcf gpgrelay_ruby.tar.gz LICENSE \
            -C gpg_relay_ruby \
            relay.rb ssh_relay.rb gpg_relay_wsl.rb gpg_relay_win.rb \
            Gemfile Gemfile.lock README.md systemd

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          body_path: ReleaseNotes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-pre') }}
          fail_on_unmatched_files: true
          files: |-
            gpgrelay_go.tar.gz
            gpgrelay_ruby.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove source code assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            for asset in ${{ github.ref_name }}.zip ${{ github.ref_name }}.tar.gz; do
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
                gh release delete-asset "$tag" "$asset" --yes
              fi
            done
          fi
